<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tシャツ色替えプレビュー</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f4f4f5;
      color: #18181b;
    }

    main {
      width: min(1000px, 100%);
      margin: auto;
      padding: 20px;
    }

    h1 {
      margin: 0 0 20px;
      font-size: clamp(24px, 5vw, 34px);
      line-height: 1.2;
    }

    .layout {
      display: grid;
      grid-template-columns: 300px minmax(0, 1fr);
      gap: 20px;
      align-items: start;
    }

    .panel {
      background: #fff;
      padding: 16px;
      border-radius: 12px;
      border: 1px solid #e4e4e7;
    }

    label {
      display: block;
      margin-top: 14px;
      margin-bottom: 6px;
      font-size: 14px;
      font-weight: 700;
    }

    label:first-child {
      margin-top: 0;
    }

    .checkboxLabel {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }

    .checkboxLabel input {
      width: auto;
    }

    input,
    select,
    button {
      max-width: 100%;
      font: inherit;
    }

    input[type="file"],
    select {
      width: 100%;
    }

    input[type="range"] {
      width: 100%;
    }

    .swatchGrid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .swatchButton {
      position: relative;
      width: 100%;
      aspect-ratio: 1;
      margin: 0;
      padding: 0;
      border: 2px solid #d4d4d8;
      border-radius: 10px;
      cursor: pointer;
      background: var(--swatch-color);
    }

    .swatchButton.isActive {
      border-color: #18181b;
      outline: 2px solid #18181b;
      outline-offset: 2px;
    }

    .swatchButton span {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
    }

    .hint {
      margin: 8px 0 0;
      color: #71717a;
      font-size: 12px;
      line-height: 1.5;
    }

    button#download {
      width: 100%;
      margin-top: 18px;
      padding: 12px 16px;
      border: 0;
      border-radius: 999px;
      background: #18181b;
      color: #fff;
      font-weight: 700;
      cursor: pointer;
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      max-height: min(600px, 70vh);
      object-fit: contain;
    }

    @media (max-width: 768px) {
      main {
        padding: 14px;
      }

      .layout {
        grid-template-columns: 1fr;
        gap: 14px;
      }

      .panel {
        padding: 14px;
      }

      .layout .panel:first-child {
        order: 2;
      }

      .layout .panel:last-child {
        order: 1;
      }

      canvas {
        max-height: 58vh;
      }
    }

    @media (max-width: 420px) {
      main {
        padding: 10px;
      }

      .panel {
        border-radius: 10px;
        padding: 12px;
      }

      h1 {
        margin-bottom: 14px;
      }
    }
  </style>
</head>
<body>
<main>
  <h1>Tシャツ色替え</h1>

  <div class="layout">
    <div class="panel">
      <label>Tシャツ面</label>
      <select id="shirtSide">
        <option value="front" selected>表</option>
        <option value="back">裏</option>
      </select>

      <label class="checkboxLabel">
        <input type="checkbox" id="invertOutline">
        枠を反転
      </label>

      <label>Tシャツ色</label>
      <div id="shirtColorButtons" class="swatchGrid"></div>

      <label>柄</label>
      <select id="designPattern"></select>
      <p class="hint">柄画像は design-01.png など、HTMLと同じ階層に置いてください。</p>

      <label>柄PNGをアップロード</label>
      <input id="designInput" type="file" accept="image/png" />
      <p class="hint">アップロードすると柄選択は「アップロード画像」に切り替わります。</p>

      <label>柄の色</label>
      <div id="designColorButtons" class="swatchGrid"></div>

      <label>サイズ</label>
      <input id="scale" type="range" min="10" max="80" value="40" />

      <label>X位置</label>
      <input id="posX" type="range" min="0" max="100" value="50" />

      <label>Y位置</label>
      <input id="posY" type="range" min="0" max="100" value="40" />

      <button id="download">保存</button>
    </div>

    <div class="panel">
      <canvas id="canvas" width="900" height="900"></canvas>
    </div>
  </div>
</main>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

const shirtSide = document.getElementById('shirtSide');
const invertOutline = document.getElementById('invertOutline');
const designInput = document.getElementById('designInput');
const designPattern = document.getElementById('designPattern');
const shirtColorButtons = document.getElementById('shirtColorButtons');
const designColorButtons = document.getElementById('designColorButtons');
const scale = document.getElementById('scale');
const posX = document.getElementById('posX');
const posY = document.getElementById('posY');

const DISPLAY_SIZE = 900;
const EXPORT_SIZE = 3000;

const shirtColors = [
  { name: 'ホワイト', value: '#ffffff' },
  { name: 'ブラック', value: '#111111' },
  { name: 'ネイビー', value: '#1e2a44' },
  { name: 'グレー', value: '#9ca3af' },
  { name: 'ベージュ', value: '#d8c3a5' },
  { name: 'レッド', value: '#b91c1c' },
  { name: 'ブルー', value: '#2563eb' },
  { name: 'グリーン', value: '#15803d' }
];

const designColors = [
  { name: 'ブラック', value: '#000000' },
  { name: 'ホワイト', value: '#ffffff' }
];

const designPatterns = [
  { name: 'なし', src: '' },
  { name: '柄 01', src: 'design-01.png' },
  { name: '柄 02', src: 'design-02.png' },
  { name: '柄 03', src: 'design-03.png' }
];

const shirtImages = {
  front: 'shirt-front.png',
  back: 'shirt-back.png'
};

let selectedShirtColor = shirtColors[0].value;
let selectedDesignColor = designColors[0].value;
let designImg = null;
let uploadedDesignUrl = '';
let cachedDesign = null;
let cachedDesignKey = '';
let cachedInvertedShirt = null;
let cachedInvertedShirtKey = '';
let renderQueued = false;

const shirtImg = new Image();
shirtImg.src = shirtImages.front;

function hexToRgb(hex){
  hex = hex.replace('#','');
  return {
    r: parseInt(hex.slice(0,2),16),
    g: parseInt(hex.slice(2,4),16),
    b: parseInt(hex.slice(4,6),16)
  };
}

function requestRender(){
  if(renderQueued) return;
  renderQueued = true;
  requestAnimationFrame(() => {
    renderQueued = false;
    render();
  });
}

function createSwatchButtons(container, colors, selectedValue, onSelect){
  container.innerHTML = '';

  colors.forEach(color => {
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'swatchButton';
    button.style.setProperty('--swatch-color', color.value);
    button.dataset.value = color.value;
    button.title = color.name;
    button.innerHTML = `<span>${color.name}</span>`;

    if(color.value === selectedValue){
      button.classList.add('isActive');
    }

    button.addEventListener('click', () => {
      onSelect(color.value);
      [...container.querySelectorAll('.swatchButton')].forEach(el => {
        el.classList.toggle('isActive', el.dataset.value === color.value);
      });
      requestRender();
    });

    container.appendChild(button);
  });
}

function populateDesignPatternSelect(){
  designPatterns.forEach((pattern, index) => {
    const option = document.createElement('option');
    option.value = String(index);
    option.textContent = pattern.name;
    designPattern.appendChild(option);
  });
}

function loadDesign(src){
  cachedDesign = null;
  cachedDesignKey = '';

  if(!src){
    designImg = null;
    requestRender();
    return;
  }

  const img = new Image();
  img.onload = () => {
    designImg = img;
    requestRender();
  };
  img.onerror = () => {
    designImg = null;
    requestRender();
    console.warn(`柄画像を読み込めません: ${src}`);
  };
  img.src = src;
}

function getInvertedShirt(){
  const key = shirtSide.value + '|' + shirtImg.src;
  if(cachedInvertedShirt && cachedInvertedShirtKey === key) return cachedInvertedShirt;

  const c = document.createElement('canvas');
  c.width = shirtImg.naturalWidth || shirtImg.width;
  c.height = shirtImg.naturalHeight || shirtImg.height;

  const x = c.getContext('2d', { willReadFrequently:true });
  x.drawImage(shirtImg, 0, 0, c.width, c.height);

  const d = x.getImageData(0, 0, c.width, c.height);

  for(let i = 0; i < d.data.length; i += 4){
    if(d.data[i+3] === 0) continue;
    d.data[i] = 255 - d.data[i];
    d.data[i+1] = 255 - d.data[i+1];
    d.data[i+2] = 255 - d.data[i+2];
  }

  x.putImageData(d, 0, 0);

  cachedInvertedShirt = c;
  cachedInvertedShirtKey = key;
  return cachedInvertedShirt;
}

function drawRecoloredShirt(targetCtx, x, y, w, h){
  targetCtx.save();
  targetCtx.globalCompositeOperation = 'source-over';

  targetCtx.fillStyle = selectedShirtColor;
  targetCtx.fillRect(x, y, w, h);

  targetCtx.globalCompositeOperation = 'destination-in';
  targetCtx.drawImage(shirtImg, x, y, w, h);

  if(invertOutline && invertOutline.checked){
    targetCtx.globalCompositeOperation = 'screen';
    targetCtx.drawImage(getInvertedShirt(), x, y, w, h);
  } else {
    targetCtx.globalCompositeOperation = 'multiply';
    targetCtx.drawImage(shirtImg, x, y, w, h);
  }

  targetCtx.restore();
  targetCtx.globalCompositeOperation = 'source-over';
}

function recolorDesign(img, color){
  const c = document.createElement('canvas');
  c.width = img.width;
  c.height = img.height;

  const x = c.getContext('2d', { willReadFrequently:true });
  x.drawImage(img, 0, 0);

  const d = x.getImageData(0, 0, c.width, c.height);
  const t = hexToRgb(color);

  for(let i = 0; i < d.data.length; i += 4){
    const a = d.data[i+3];
    if(a === 0) continue;

    const r = d.data[i];
    const g = d.data[i+1];
    const b = d.data[i+2];
    const darkness = 1 - ((r + g + b) / 3 / 255);

    d.data[i] = t.r;
    d.data[i+1] = t.g;
    d.data[i+2] = t.b;
    d.data[i+3] = Math.round(a * Math.max(0, Math.min(1, darkness * 1.25)));
  }

  x.putImageData(d, 0, 0);
  return c;
}

function getRecoloredDesign(){
  if(!designImg) return null;

  const key = selectedDesignColor + '|' + designImg.src;
  if(cachedDesign && cachedDesignKey === key) return cachedDesign;

  cachedDesign = recolorDesign(designImg, selectedDesignColor);
  cachedDesignKey = key;
  return cachedDesign;
}

function draw(targetCtx, size){
  targetCtx.clearRect(0, 0, size, size);
  if(!shirtImg.complete || !shirtImg.naturalWidth) return;

  const ratio = Math.min(size / shirtImg.width, size / shirtImg.height);
  const w = shirtImg.width * ratio;
  const h = shirtImg.height * ratio;
  const x = (size - w) / 2;
  const y = (size - h) / 2;

  drawRecoloredShirt(targetCtx, x, y, w, h);

  if(!designImg) return;

  const design = getRecoloredDesign();
  const dw = w * (Number(scale.value) / 100);
  const dh = dw * (designImg.height / designImg.width);

  const dx = x + w * (Number(posX.value) / 100) - dw / 2;
  const dy = y + h * (Number(posY.value) / 100) - dh / 2;

  targetCtx.globalCompositeOperation = 'source-over';
  targetCtx.filter = 'none';
  targetCtx.drawImage(design, dx, dy, dw, dh);
}

function render(){
  draw(ctx, DISPLAY_SIZE);
}

createSwatchButtons(shirtColorButtons, shirtColors, selectedShirtColor, value => {
  selectedShirtColor = value;
});

createSwatchButtons(designColorButtons, designColors, selectedDesignColor, value => {
  selectedDesignColor = value;
  cachedDesign = null;
  cachedDesignKey = '';
});

populateDesignPatternSelect();

shirtImg.onload = requestRender;

shirtSide.addEventListener('change', () => {
  cachedInvertedShirt = null;
  cachedInvertedShirtKey = '';
  shirtImg.src = shirtImages[shirtSide.value];
});

if(invertOutline){
  invertOutline.addEventListener('change', requestRender);
}

designPattern.addEventListener('change', () => {
  const pattern = designPatterns[Number(designPattern.value)];
  loadDesign(pattern.src);
});

designInput.addEventListener('change', e => {
  const file = e.target.files[0];
  if(!file) return;

  if(uploadedDesignUrl){
    URL.revokeObjectURL(uploadedDesignUrl);
  }

  uploadedDesignUrl = URL.createObjectURL(file);

  let uploadOption = [...designPattern.options].find(option => option.value === 'upload');
  if(!uploadOption){
    uploadOption = document.createElement('option');
    uploadOption.value = 'upload';
    uploadOption.textContent = 'アップロード画像';
    designPattern.appendChild(uploadOption);
  }

  designPattern.value = 'upload';
  loadDesign(uploadedDesignUrl);
});

[scale, posX, posY].forEach(el => {
  el.addEventListener('input', requestRender);
});

document.getElementById('download').onclick = () => {
  const exportCanvas = document.createElement('canvas');
  exportCanvas.width = EXPORT_SIZE;
  exportCanvas.height = EXPORT_SIZE;

  const exportCtx = exportCanvas.getContext('2d');
  draw(exportCtx, EXPORT_SIZE);

  const a = document.createElement('a');
  a.href = exportCanvas.toDataURL('image/png');
  a.download = 'preview.png';
  a.click();
};

render();
</script>
</body>
</html>
